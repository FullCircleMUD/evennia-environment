[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evennia-environment"
version = "0.0.1"
description = "Terrain and weather for Evennia — what a room's surroundings do to whoever is standing in it."
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [{name = "Tim Baird"}]
requires-python = ">=3.10"
keywords = ["evennia", "mud", "terrain", "weather", "environment"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Multi-User Dungeons (MUD)",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "evennia",
    "evennia-logging-extension",
    "evennia-calendar",
]

[project.urls]
Homepage = "https://github.com/FullCircleMUD/evennia-environment"
Repository = "https://github.com/FullCircleMUD/evennia-environment"
Issues = "https://github.com/FullCircleMUD/evennia-environment/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["evennia_environment*"]
